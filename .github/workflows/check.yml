name: Palette and ports
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python tools/build.py --check
      - run: python -m unittest discover -s tests -v
      - name: Install isolated smoke-test applications
        run: sudo apt-get update -qq && sudo apt-get install -y neovim bat
      - name: Load Neovim colorscheme
        run: nvim --headless -u NONE -i NONE -c 'luafile tests/neovim-smoke.lua'
      - name: Import and render bat theme
        run: |
          mkdir -p "$(batcat --config-dir)/themes"
          cp ports/bat/Deliverator-Signal.tmTheme "$(batcat --config-dir)/themes/"
          batcat cache --build
          batcat --theme=Deliverator-Signal --color=always --paging=never tools/color.py > /dev/null
